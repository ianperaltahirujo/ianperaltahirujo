<svg viewBox="0 0 1000 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — JMMB Puesto de Bolsa, La Sociedad and Partners, independent projects, Penn State University">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ghost: #000000; }
  </style>

  <line x1="120" y1="10" x2="120" y2="360" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="12" fill="var(--accent)" letter-spacing="2">2026</text>
    <text class="mono" x="136" y="42"  font-size="15" fill="var(--bone)">JMMB Puesto de Bolsa · Capital Markets Intern · Santo Domingo · Jul–Aug</text>
    <text class="mono" x="136" y="68"  font-size="14" fill="var(--muted)">built a data-extraction pipeline (pypdfium2) digitizing audited filings for JMMB + 14 peer broker-dealers</text>
    <text class="mono" x="136" y="90"  font-size="14" fill="var(--muted)">translated 30+ scanned Spanish financial/legal documents into English deliverables</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="138" font-size="12" fill="var(--accent)" letter-spacing="2">2026</text>
    <text class="mono" x="136" y="138" font-size="15" fill="var(--bone)">La Sociedad &amp; Partners Consulting Group · Data Science Intern · Santo Domingo · May–Jul</text>
    <text class="mono" x="136" y="164" font-size="14" fill="var(--muted)">built an automated HR applicant-screening pipeline (Power Automate + Claude) for 100+ CVs</text>
    <text class="mono" x="136" y="186" font-size="14" fill="var(--muted)">engineered a live macro-indicator scoring pipeline · delivered 3 executive presentations</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="234" font-size="12" fill="var(--accent)" letter-spacing="2">2026</text>
    <text class="mono" x="136" y="234" font-size="15" fill="var(--bone)">Independent Technical Projects · Mar–Jun</text>
    <text class="mono" x="136" y="260" font-size="14" fill="var(--muted)">DR Economic Vulnerability Index · U.S. Recession Probability Dashboard (AUC-ROC 0.998)</text>
    <text class="mono" x="136" y="282" font-size="14" fill="var(--muted)">Global Aviation Recovery Analysis — 6 years of traffic across the 20 busiest airports</text>
  </g>

  <g class="rise a4">
    <text class="mono" x="48" y="330" font-size="12" fill="var(--accent)" letter-spacing="2">2024 –</text>
    <text class="mono" x="136" y="330" font-size="15" fill="var(--bone)">Penn State University · B.S. Applied Data Sciences · State College, PA</text>
    <text class="mono" x="136" y="356" font-size="14" fill="var(--muted)">machine learning · statistical modeling · data management · privacy &amp; security for data sciences</text>
  </g>
</svg>
